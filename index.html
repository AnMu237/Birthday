<div class="shell"><div class="topline"><div class="brand">⚜ DER RUF DER LETZTEN RITTER</div><button id="reset" title="Spielstand löschen">↺ Abenteuer neu beginnen</button></div><div class="layout"><main class="sheet" id="main" aria-live="polite"></main><aside class="sidebar"><section class="panel"><h3>✧ Eure Reise</h3><div class="progress-label"><span>Bestandene Prüfungen</span><strong id="counter">0 / 10</strong></div><div class="progress-line"><div class="progress-fill" id="bar"></div></div><p>Der Hohe Rat verfolgt Eure Fortschritte mit größter Aufmerksamkeit.</p></section><section class="panel"><h3>Die Chronik</h3><div class="chapter-list" id="chapters"></div></section></aside></div><div class="footnote">Ein digitales Ritterabenteuer für Dame Maribolda von Schapenstein · Zur Unterhaltung, nicht als echte Fahrkarte geeignet</div></div>
<script>
// Alle Inhalte funktionieren offline; lediglich die optionalen Google-Schriftarten werden online geladen.
const TITLES=['Die nullte Prüfung','Das Licht der Erkenntnis','Die Weisungen des Kartographen','Der königliche Fahrkartenautomat','Der Fluch des eisernen Rosses','Die Bestie auf dem eisernen Pfad','Der Ruf des Marktes','Der Handel mit dem Fremden','Die vergessenen Orden','Das Vermächtnis der Sterne'];
const SUBS=['Zwei Fragen des Hohen Rates','Die erste Prüfung','Die zweite Prüfung','Die dritte Prüfung','Die vierte Prüfung','Die fünfte Prüfung','Die sechste Prüfung','Die siebte Prüfung','Die achte Prüfung','Die neunte Prüfung'];
const KEY='maribolda-v1';let state={level:0,unlocked:0,answers:{},stone:false,food:false,money:25},feedback='';
try{const old=JSON.parse(localStorage.getItem(KEY));if(old&&Number.isInteger(old.level)){state={...state,...old}}}catch(e){}
const $=id=>document.getElementById(id), esc=s=>String(s??'').replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
const norm=s=>String(s??'').toLocaleLowerCase('de-DE').normalize('NFD').replace(/[\u0300-\u036f]/g,'').replace(/[^a-z0-9]/g,'');
function setGameAnswer(id,val){state.answers[id]=val;save()}const get=(id,defaultVal='')=>state.answers[id]??defaultVal;
function save(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function nav(n){if(n<0||n>state.unlocked)return;state.level=n;feedback='';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function advance(){state.unlocked=Math.max(state.unlocked,state.level+1);state.level=Math.min(9,state.level+1);feedback='';save();render();window.scrollTo({top:0,behavior:'smooth'})}
function msg(s,good=false){feedback=`<div class="notice ${good?'':'bad'}">${s}</div>`;renderFeedback()}
function renderFeedback(){const area=$('feedback');if(area)area.innerHTML=feedback}
function shell(inner){const n=state.level;return `<div class="seal">⚜</div><div class="eyebrow">${SUBS[n]}</div><h1>${n===0?'Der Ruf der letzten Ritter':TITLES[n]}</h1>${n===0?'<h2>Eine Botschaft des Hohen Rates · Anno Domini MCCXI</h2>':'<h2>Eine Prüfung des Hohen Rates</h2>'}<div class="line"></div><div class="story">${inner}</div><div id="feedback">${feedback}</div>`}
function gift(title,text){return `<div class="gift"><div class="gift-title">🎁 EINE BELOHNUNG WIRD ÜBERREICHT</div><p><strong>${title}</strong><br>${text}</p></div>`}
function next(text='Die nächste Prüfung antreten'){return `<div class="cta-row"><button class="cta" onclick="advance()">${text} →</button></div>`}
function choice(id,options){return `<div class="choices">${options.map(o=>`<button class="choice ${get(id)==o.v?'selected':''}" onclick="setGameAnswer('${id}','${o.v}');render()"><strong>${o.t}</strong><small>${o.s||''}</small></button>`).join('')}</div>`}
function field(id,label,placeholder='Antwort eingeben'){return `<label for="${id}">${label}</label><input id="${id}" type="text" placeholder="${placeholder}" value="${esc(get(id))}" autocomplete="off" data-answer="${id}">`}
function story(){switch(state.level){
case 0:return shell(`<p><strong>Höret her!</strong> An die ehrenwerte Dame Maribolda von Schapenstein, deren Mut weithin gerühmt, deren Tapferkeit (un)bestritten und deren Kampferfahrung bislang nur unzureichend dokumentiert ist.</p><p>Dunkle Zeiten ziehen über die Lande von Marburg. Ein uralter Bund steht vor seiner größten Herausforderung. Seine Reihen sind geschwächt: Die einen sind verschollen, die anderen stark beschäftigt, und wieder andere klagen über Beschwerden im Rücken.</p><p>Der Hohe Rat hat nach langer Beratung und nicht unerheblichen Mengen Hoheasthoimer beschlossen, <em>Euch</em> mit einer Mission von höchster Wichtigkeit zu betrauen.</p><p>Wohin die Reise führt, verrät niemand. Doch wer die Wahrheit finden will, <strong>muss jeden Stein umdrehen</strong>. Merket Euch dies wohl!</p><p>Ehe man Euch vertraut, gilt es, Eure wahre Identität zu beweisen. Zwei Fragen sollen über Eure Würdigkeit entscheiden.</p><h3>I. Die alten Schriften</h3><p class="question">ANNO DOMINI MCCXI</p><h3>II. Der königliche Trank</h3><p>Aus welcher Hauptzutat wird der sagenumwobene Hoheasthoimer bereitet?</p><div class="control">${field('year','In welchem Jahr befinden wir uns?','Jahreszahl')}${field('drink','Woraus besteht der königliche Trank?','Zutat')}</div><div class="cta-row"><button class="cta" onclick="check0()">Würdigkeit prüfen</button></div><p class="quiet">Der Hohe Rat behält sich vor, unsinnige Antworten mit einer ungewöhnlich langen Sitzung zu bestrafen.</p>`);
case 1:return shell(`<p>Höret, Dame Maribolda von Schapenstein, ehe Ihr in den Kampf zieht, ziemt es sich, bei höheren Mächten Rat zu suchen.</p><p>Suchet weder Markt noch Herberge, weder Burg noch Taverne, sondern jene ehrwürdige Stätte zu Marburg, die einer heiligen Frau gewidmet ward und deren steinerne Türme gen Himmel ragen.</p><p>Wo Dunkelheit herrscht, vermag ein einziger Funke ein Geheimnis zu offenbaren. Entzündet das Licht.</p><div class="control"><label>Welcher heiligen Stätte gilt Euer Besuch?</label><input type="text" id="church" value="${esc(get('church'))}" autocomplete="off" data-answer="church" placeholder="Name der Stätte"><div class="cta-row"><button class="cta secondary" onclick="checkChurch()">Die Stätte finden</button></div></div>${get('churchOK')?`<div class="control"><p><strong>Das Licht offenbart einen geheimen Code:</strong></p><div class="qr-quest"><p>Das verborgene Zeichen ist endlich sichtbar. Scannet es mit einem anderen Gerät oder öffnet die Botschaft direkt.</p><img class="qr-code" src="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAmIAAAJiCAIAAADrNDmxAAAAAXNSR0IArs4c6QAAPmdJREFUeF7t3W3QV9V573H+BKIWUKqZRDKjmPgUg0c7RpJWrK021tS2Ex8TFTUBLQgeb24FwUpPcmZ6dFABlU4lEoW80KRtMjQvMlRDe17gQydRO2UmPjSHHjXmTGqqOTrqxOMTZ+s/Y24e/uu/1/7ta6+1rvtr3uTFXg/X51prX/e+WSx6E9z9t3PnzkBMvV6vccRKz+G2jadUNQxHZDdnZdxwvErPdm3Dc07lrMxKyYIybqoc2c1Z6VnZ+0rbVG9CZc6p2k5MNTDjIoAAAgggkL8AZTL/HDFDBBBAAIFkApTJZPQMjAACCCCQvwBlMv8cMUMEEEAAgWQClMlk9AyMAAIIIJC/AGUy/xwxQwQQQACBZAKUyWT0DIwAAgggkL8AZTL/HDFDBBBAAIFkApTJZPQMjAACCCCQv8CQK2ns7o5RaFLd4qHctKLEG26rzKrEtoqksp6VW0tSzVkZ198uS7Xalf2rZDDcVlnPdpJ28SoafE2mygvjIoAAAggUIECZLCBJTBEBBBBAIJUAZTKVPOMigAACCBQgQJksIElMEQEEEEAglQBlMpU84yKAAAIIFCBAmSwgSUwRAQQQQCCVAGUylTzjIoAAAggUIECZLCBJTBEBBBBAIJUAZTKVPOMigAACCBQgIN3Co9zjELaxu+VBuVskPGdFQ4k3T0llVoqzcs+O3X5V1oYiqax2uzmnikjJb56Sdu+NVDmyW3WKFV+Tyt6hLQIIIICAcwHKpPMEEx4CCCCAgCJAmVT0aIsAAggg4FyAMuk8wYSHAAIIIKAIUCYVPdoigAACCDgXoEw6TzDhIYAAAggoApRJRY+2CCCAAALOBSiTzhNMeAgggAACigBlUtGjLQIIIICAc4Fx case 2:return shell(`<p>Ihr habt den Ort der eisernen Rosse erreicht. Der königliche Kartograph hat Euch drei Weisungen hinterlassen. Vereint Richtung, Maß und Reisemittel, um die gesuchte Stadt zu finden.</p><h3>I. Die Weisung der Himmelswinde</h3><p>Berechnet: <strong>(7 × 2) − (4 × 3)</strong>. Welche Himmelsrichtung verrät das Ergebnis?</p><p class="small">Alte Ordnung: 1 = Norden · 2 = Osten · 3 = Süden · 4 = Westen</p>${choice('direction',[{v:'n',t:'Norden'},{v:'o',t:'Osten'},{v:'s',t:'Süden'},{v:'w',t:'Westen'}])}<h3>II. Die Weisung der Entfernung</h3><p>Vervielfacht die zwölf Monate mit der Zahl der Musketiere, zieht die Finger dreier Hände ab und teilt das Ergebnis durch die Augen eines gewöhnlichen Ritters.</p><div class="control">${field('distance','Wie viele Kilometer Luftlinie trennen Euch ungefähr vom Ziel?','z. B. 6,7')}</div><h3>III. Die Weisung des eisernen Pfades</h3><p>Nicht zu Fuß, nicht zu Pferde und auch nicht in einer klapprigen Kutsche. Folget dem eisernen Pfad!</p><div class="control">${field('destination','Wie heißt die gesuchte Stadt?','Stadtname')}<div class="cta-row"><button class="cta" onclick="checkMap()">Die drei Weisungen vereinen</button></div></div>`);
case 3:return shell(`${gift('Die Waffen der tapferen Streiterin','Bevor Ihr die Reise antretet, packet Eure Waffen ein. Die Begleiter des Hohen Rates überreichen Euch zwei ungewöhnlich schlanke Kampfgeräte.')}<p>Ihr gelangt an einen sonderbaren Kasten aus Eisen und Glas: den <strong>königlichen Fahrkartenautomaten</strong>.</p><blockquote>Nur wer den rechten Fahrschein wählt und den geforderten Wegezoll entrichtet, dem sei die Fahrt auf dem eisernen Ross gestattet.</blockquote><h3>I. Die Wahl des Fahrscheins</h3><p>Gesucht: Marburg → Kirchhain, zweite Wagenklasse, einfache Fahrt, heutiger Reisetag.</p><div class="choices">${[{v:'a',a:'Marburg → Kirchhain',b:'2. Klasse',c:'Hin- und Rückfahrt',d:'Heute'},{v:'b',a:'Marburg → Kirchhain',b:'2. Klasse',c:'Einfache Fahrt',d:'Heute'},{v:'c',a:'Marburg → Kirchhain',b:'2. Klasse',c:'Einfache Fahrt',d:'Gestern'}].map((t,i)=>`<button class="choice ${get('ticket')===t.v?'selected':''}" onclick="setGameAnswer('ticket','${t.v}');render()"><div class="ticket"><div class="ticket-top"><strong>BILLET ${i+1}</strong><span class="db">DB</span></div><div class="ticket-main"><strong>${t.a}</strong></div><small>${t.b}<br>${t.c}<br>Gültig: ${t.d}</small></div></button>`).join('')}</div><h3>II. Der königliche Wegezoll</h3><p>Für jede der 20 königlichen Meilen wird ein Silberling verlangt. Der Hohe Rat gewährt ein Viertel Nachlass. Maribolda besitzt zu Beginn <strong>25 Silberlinge</strong>.</p><p>Welchen Preis verlangt der Automat?</p>${choice('fare',[{v:'12',t:'12 Silberlinge'},{v:'15',t:'15 Silberlinge'},{v:'18',t:'18 Silberlinge'}])}<div class="cta-row"><button class="cta" onclick="checkTicket()">Fahrschein erwerben</button></div>`);
case 4:return shell(`<p>Das eiserne Ross setzt sich in Bewegung. Doch schon nach wenigen Augenblicken kommt der Zug mit einem gewaltigen Quietschen zum Stillstand.</p><blockquote>Werte Reisende, aufgrund einer kurzfristigen Störung im königlichen Stellwerk verzögert sich unsere Weiterfahrt um wenige Augenblicke.</blockquote><p>Eine Stunde später ertönt dieselbe Durchsage erneut. Der Schaffner erscheint und bittet Euch, die Weichen eigenhändig zu stellen. Der Stellwerkmeister befinde sich seit vergangenem Dienstag in der Mittagspause.</p><p>Ihr steigt aus. Plötzlich stolpert Ihr über <strong>einen sonderbaren Stein</strong>.</p><div class="control"><p>Was möchtet Ihr tun?</p><button class="cta secondary" onclick="flipStone()">🪨 Den Stein umdrehen</button> <button class="cta secondary" onclick="msg('Ihr lasst den Stein liegen. Ob das klug war, wird sich noch zeigen ...',false)">Weitergehen</button>${state.stone?`<div class="notice"><strong>Ein Geheimnis!</strong> Unter dem Stein verbirgt sich eine rätselhafter Hinweis. Bewahret Fund und Stein gut auf. Was die Zeichen bedeuten, bleibt vorerst verborgen.</div>`:''}</div><h3>Die Prüfung des königlichen Stellwerks</h3><p>Der Stellwerkmeister hinterließ drei Hinweise:</p><p><strong>I.</strong> Die erste und dritte Weiche zeigen in verschiedene Richtungen.<br><strong>II.</strong> Die zweite zeigt in dieselbe Richtung wie die erste.<br><strong>III.</strong> Genau eine Weiche zeigt nach rechts.</p><div class="switches">${[0,1,2].map(i=>{const v=get('sw'+i,'L');return `<div class="switch"><span class="switch-label">Weiche ${i+1}</span><svg width="110" height="75" viewBox="0 0 110 75"><path d="M5 37 L48 37 L100 ${v==='L'?8:68}" fill="none" stroke="#6e6a5b" stroke-width="6" stroke-linecap="round"/><path d="M48 37 L100 ${v==='L'?68:8}" fill="none" stroke="#b1aa8d" stroke-width="3" stroke-dasharray="5 4"/></svg><button onclick="setGameAnswer('sw${i}','${v==='L'?'R':'L'}');render()">${v==='L'?'← Links':'Rechts →'} ↻</button></div>`}).join('')}</div><div class="cta-row"><button class="cta" onclick="checkSwitch()">Weichenstellung prüfen</button></div>`);
case 5:return shell(`<p>Dank Eurer außergewöhnlichen Fähigkeiten im Stellwerk rollt das eiserne Ross erneut. Dann folgt eine Vollbremsung. Schon wieder.</p><blockquote>Aufgrund eines unbefugten Aufenthaltes von Großvieh im Gleisbereich verzögert sich unsere Weiterfahrt auf unbestimmte Zeit.</blockquote><p>Vor dem Zug steht eine ausgesprochen störrische Kuh. Sie weigert sich, den eisernen Pfad zu verlassen. Der königliche Kuhhirte hat sechs Gegenstände zurückgelassen, aber nur drei davon helfen – und auch nur in der richtigen Reihenfolge.</p><div class="rails"><div class="cow">🐄</div><small>„Muuuh.“ – Die Bestie zeigt keinerlei Einsicht.</small></div><blockquote>Erwecket zuerst ihre Neugier mit einem hellen Klang. Lockt sie sodann mit einem Geschenk der Natur. Zuletzt sorget dafür, dass sie nicht auf den Pfad zurückkehrt.</blockquote><h3>Wählet die Gegenstände in der richtigen Reihenfolge</h3><div class="items">${[['glocke','🔔','Glocke'],['heu','🌾','Heu'],['seil','🪢','Seil'],['apfel','🍎','Apfel'],['eimer','🪣','Eimer'],['karotte','🥕','Karotte']].map(i=>`<button class="item ${get('cowSequence',[]).includes(i[0])?'done':''}" onclick="cowPick('${i[0]}')"><span class="emoji">${i[1]}</span>${i[2]}</button>`).join('')}</div><p class="small">Bisherige Auswahl: <strong>${(get('cowSequence',[])||[]).map(x=>({glocke:'Glocke',heu:'Heu',seil:'Seil',apfel:'Apfel',eimer:'Eimer',karotte:'Karotte'})[x]).join(' → ')||'Noch keine'}</strong></p><div class="cta-row"><button class="cta secondary" onclick="setGameAnswer('cowSequence',[]);render()">Auswahl löschen</button><button class="cta" onclick="checkCow()">Die Bestie besänftigen</button></div>${get('cowOK')?`<div class="line"></div><h3>Der fahrende Proviantmeister</h3><p>Endlich rollt der Zug wieder. Ein Händler schiebt seinen Wagen durch den Zug: „Süßes Wegzehrungsgut! Nur <strong>4 Silberlinge</strong>!“ Ihr besitzt nach dem Fahrscheinkauf noch <strong>10 Silberlinge</strong>.</p><p>Wollt Ihr von Eurem verbliebenen Geld etwas Proviant erwerben?</p>${choice('provision',[{v:'yes',t:'Proviant kaufen',s:'4 Silberlinge'},{v:'no',t:'Nichts kaufen',s:'Silber sparen'}])}<button class="cta" onclick="checkProvision()">Entscheidung treffen</button>`:''}`);
case 6:return shell(`<p>Mit einer Verspätung von lediglich 247 Minuten erreicht Ihr den Bahnhof Kirchhain. Die königliche Eisenbahngesellschaft bezeichnet dies als „weitestgehend störungsfreie Reise“.</p><p>Doch wohin nun? Weder Burg noch Schlachtfeld sind in Sicht. Ihr findet einen alten Wegweiser:</p><div class="verse"><span>Wo Gold den Besitzer wechselt,</span><span>wo Händler ihre Stimmen erheben,</span><span>wo Waren aus fernen Landen feilgeboten werden,</span><span>und wo jeder um den besten Preis feilscht,</span><span>dort wartet die nächste Botschaft.</span></div><div class="control">${field('market','Welchen Ort müsst Ihr aufsuchen?','Ort in Kirchhain')}<div class="cta-row"><button class="cta" onclick="checkMarket()">Den Weg finden</button></div></div>`);
case 7:return shell(`<p>Auf Kirchhains Marktplatz herrscht reges Treiben. Ein Händler versucht, ein krankes Huhn als königlichen Jagdfalken zu verkaufen. Daneben erwartet Euch ein Mann mit gewaltigem Bart.</p><p>„Dame Maribolda! Für die bevorstehende Schlacht benötigt Ihr eine Rüstung, die Euren Blick unter widrigsten Bedingungen schützt.“ Er zieht ein sorgfältig verhülltes Stück seiner kostbarsten Ausrüstung hervor. Was darunter verborgen liegt, sollt Ihr erst nach dem Handel erfahren.</p><p>„Gold und Silber will ich nicht. Nur einen Gegenstand, der älter sein könnte als unser Königreich, den andere achtlos am Wegesrand liegen lassen und dessen Wert allein im Auge des Betrachters liegt.“</p><h3>Was bietet Ihr dem Händler an?</h3>${choice('trade',[{v:'ticket',t:'Den Fahrschein'},{v:'stone',t:'Den seltsamen Stein'},{v:'sticks',t:'Die langen Waffen'}])}<div class="cta-row"><button class="cta" onclick="checkTrade()">Den Handel besiegeln</button></div>`);
case 8:return shell(`<p>Nachdem der Handel abgeschlossen ist, beugt sich der Fremde zu Euch vor.</p><p>„Kirchhain ist Heimat mächtiger, längst vergessener Ritterorden. Jeder Orden besitzt eine eigene Farbe und einen geheimen Versammlungsort. Nur einer von ihnen ist jener Bund, den Ihr zu finden bestimmt seid.“</p><p>Er überreicht Euch ein Pergament mit dreizehn Versen:</p><div class="verse">${['Lange schon schweigen die Hallen der Alten,','Einst wurden hier mächtige Schwüre gehalten.','Tapfer zogen die Streiter hinaus,','Zogen für Ehre und Ruhm in den Kampf hinaus.','Trotz aller Gefahren blieb keiner zurück,','Einigkeit war stets ihr größtes Glück.','Niemals verrieten sie ihren Bund,','Ruhm und Treue waren in aller Munde.','In dunklen Zeiten hielten sie stand,','Trotz aller Feinde im ganzen Land.','Tapfer bewahrten sie ihren Eid,','Ewig verbunden durch Raum und Zeit.','Ritter von einst, zur Rückkehr bereit.'].map(s=>`<span>${s}</span>`).join('')}</div><blockquote>Wer den Ursprung unserer Worte versteht, wird erfahren, wer wir sind.</blockquote><div class="control">${field('order','Wie heißt der gesuchte Orden?','Name des Ordens')}<button class="cta" onclick="checkOrder()">Ordensnamen entschlüsseln</button></div>${get('orderOK')?`<h3>Die Farbe des Bundes</h3><p>„Unser Wappen trägt weder Frühlingsgrün noch Sommergrün, sondern das blasse, frostige Grün eines Morgens nach der ersten kalten Nacht. Suchet den richtigen Ort auf der Karte.“</p><p class="manual">e </p><div class="colors">${[['rot','#a23c3d','Der rote Greif'],['silber','#adb7b9','Die Silberwölfe'],['gold','#c39c41','Die goldene Lanze'],['frost','#89a99d','Der geheime Bund']].map(c=>`<button class="color-button" onclick="checkColor('${c[0]}')"><span class="swatch" style="background:${c[1]}"></span><strong>${c[2]}</strong></button>`).join('')}</div>`:''}`);
case 9:return shell(`<p>Ihr erreicht endlich den geheimen Versammlungsort. Doch statt einer mächtigen Festung herrscht nichts als Finsternis. Keine Fackel brennt, kein Ritter hält Wache.</p><p>Vergeblich sucht Ihr nach einer Erklärung. Schließlich setzt Ihr Euch auf einen großen Stein und richtet den Blick nach oben.</p><div class="night" aria-label="Funkelnder nächtlicher Sternenhimmel"></div><p>Da ertönt eine Stimme aus der Dunkelheit:</p><blockquote>„Dame Maribolda von Schapenstein! Ihr habt alle Prüfungen bestanden. Doch die letzte Botschaft unseres Ordens liegt seit Jahrhunderten am Firmament verborgen. Nur wer die Zeichen seiner Reise richtig deutet, wird erfahren, wo die letzte Schlacht geschlagen werden soll.“</blockquote>${gift('Die Sternenkarte','Eure Begleiter überreichen Euch nun eine geheimnisvolle Botschaft. Nutzt den Fund vom Stein, um ihr Geheimnis zu entschlüsseln.')}<p>Verbindet die Sterne mithilfe der alten Legende und sprecht den verborgenen Namen aus.</p><div class="control">${field('final','Welcher Name erscheint am Sternenhimmel?','Die letzte Lösung')}<div class="cta-row"><button class="cta" onclick="checkFinal()">Das Geheimnis enthüllen</button></div></div>`);
}}
function showCompletion(n,txt){msg(txt,true);const area=$('feedback');area.innerHTML+=next(n)}
function check0(){const y=norm(get('year')),d=norm(get('drink'));if(y!=='1211')return msg('Der Hohe Rat runzelt die Stirn. Die alten Zeichen sind noch nicht richtig gedeutet.');if(d.length<3)return msg('Der königliche Trank verlangt eine ernsthafte Antwort.');showCompletion('Die erste Prüfung empfangen','Der Hohe Rat erklärt Euch für würdig! Die Antwort zum Hoheasthoimer dürfen Eure Begleiter noch einmal persönlich überprüfen.')} // Antwort bewusst nicht fest codiert.
function checkChurch(){if(['elisabethkirche','stelisabethkirche','sanktelisabethkirche'].includes(norm(get('church')))){setGameAnswer('churchOK',true);msg('Das Licht wird entzündet. Eine geheimnisvolle Botschaft erscheint ...',true);render()}else msg('Weder Burg noch Markt! Denket an die heilige Elisabeth und ihre Kirche zu Marburg.')}
function checkStation(){if(get('nextPlace')==='bahnhof')showCompletion('Zum königlichen Kartographen','„Ding — Dong“! Ganz recht: Der Bahnhof ruft.');else msg('Denket an den vertrauten Klang, mit dem ein Zug seine Ankunft ankündigt.')}
function checkMap(){if(get('direction')!=='o')return msg('Der erste Wächter zeigt noch in die falsche Richtung.');if(!['105','10komma5','zehnkommafunf'].includes(norm(get('distance'))))return msg('Die Entfernung stimmt noch nicht. Rechnet die Finger und Augen erneut.');if(norm(get('destination'))!=='kirchhain')return msg('Richtung und Entfernung mögen stimmen, doch die gesuchte Stadt ist noch verborgen.');showCompletion('Waffen packen und Fahrschein erwerben','Kirchhain! Ihr habt Euer Ziel erkannt. Der Hohe Rat befiehlt: Packt eure Waffen ein!')}
function checkTicket(){if(get('ticket')!=='b')return msg('Dieser Fahrschein ist ungültig. Prüfet Reisetag, Fahrtrichtung, Wagenklasse und Fahrtart.');if(get('fare')!=='15')return msg('Der Wegezoll ist falsch berechnet. Ein Viertel Rabatt auf zwanzig Silberlinge!');state.money=10;save();showCompletion('Das eiserne Ross besteigen','Wohlgetan! Für 15 Silberlinge habt Ihr den Fahrschein erworben. In Eurer Börse verbleiben 10 Silberlinge.')}
function flipStone(){state.stone=true;save();render();msg('Ihr habt den Stein umgedreht. Eure Begleiter überreichen Euch nun den echten Stein mit der Legende.',true)}
function checkSwitch(){if(get('sw0','L')==='L'&&get('sw1','L')==='L'&&get('sw2','L')==='R'){if(!state.stone)return msg('Die Weichen sind richtig! Doch beim Einsteigen stolpert Ihr <strong>erneut</strong> über denselben sonderbaren Stein. Werdet Ihr ihn diesmal umdrehen?');showCompletion('Die Fahrt fortsetzen','Links – Links – Rechts! Die Weichen sind richtig gestellt. Der Schaffner dankt Euch, ohne eine Entschädigung zu gewähren.')}else msg('Bei allen Heiligen! Noch führt diese Weichenstellung nicht ans Ziel. Prüfet die drei Weisungen.')}
function cowPick(v){const a=[...get('cowSequence',[])];if(a.length>=3)return msg('Drei Gegenstände genügen. Prüfet zunächst Eure Auswahl.');a.push(v);setGameAnswer('cowSequence',a);render()}
function checkCow(){const a=get('cowSequence',[]);if(JSON.stringify(a)!==JSON.stringify(['glocke','heu','seil']))return msg('Die Kuh blickt Euch unbeeindruckt an. „Muuuh.“ Vielleicht braucht sie erst Eure Aufmerksamkeit, dann einen Leckerbissen und zuletzt einen sicheren Platz.');setGameAnswer('cowOK',true);render();msg('Die Kuh verlässt die Gleise. Endlich! Kurz darauf erscheint der Proviantmeister.',true)}
function checkProvision(){const v=get('provision');if(!v)return msg('Der Händler wartet ungeduldig. Wollt Ihr Proviant erwerben?');state.food=v==='yes';state.money=v==='yes'?6:10;save();if(v==='yes')showCompletion('In Kirchhain ankommen','Für 4 Silberlinge erhaltet Ihr köstlichen Proviant. Es bleiben 6 Silberlinge.');else showCompletion('In Kirchhain ankommen','Ihr behaltet Eure 10 Silberlinge. Der Händler zieht enttäuscht weiter. Das eiserne Ross nähert sich Kirchhain.')}
function checkMarket(){if(['markt','marktplatz','kirchhainermarkt','kirchhainermarktplatz'].includes(norm(get('market'))))showCompletion('Zum Händler auf dem Markt','Ganz recht: Der Marktplatz. Dort wartet ein sonderbarer Händler auf Euch.');else msg('Wo preisen Händler gemeinsam ihre Waren an?')}
function checkTrade(){if(get('trade')!=='stone')return msg('Der Händler schüttelt den Kopf: „Ich begehre nichts als einen ganz besonderen Fund vom Wegesrand!“');if(!state.stone)return msg('Ihr habt keinen Stein. Erinnert Euch an die Reise und den Rat, jeden Stein umzudrehen.');showCompletion('Den Geheimorden suchen',`Der Händler nimmt den Stein und überreicht Euch eine ungewöhnliche Augenrüstung. <strong>Eure Begleiter überreichen Euch nun die erhandelte Rüstung.</strong> Die Legende vom Stein behaltet Ihr.`)}
function checkOrder(){if(['dieletztenritter','letztenritter','ordenderletztenritter'].includes(norm(get('order')))){setGameAnswer('orderOK',true);render();msg('Der Händler nickt ehrfürchtig. Nun gilt es, die richtige Farbe auf der Ordenskarte zu finden.',true)}else msg('„Wer den Ursprung unserer Worte versteht ...“ Was verraten die Anfangsbuchstaben der Verse?')}
function checkColor(c){if(c!=='frost')return msg('Dies ist nicht die Farbe der letzten Ritter. Denket an das blasse Grün des ersten Frostes.');showCompletion('Den verborgenen Versammlungsort erreichen','Das frostgrüne Wappen! Endlich kennt Ihr den Standort des Ordens der letzten Ritter.')}
function checkFinal(){if(norm(get('final'))!=='battlearea')return msg('Noch sind die Sterne nicht richtig verbunden. Verwendet die echten Hinweise, die Euch auf der Reise begegnet sind.');$('main').innerHTML=`<div class="seal">♛</div><div class="eyebrow">Die große Enthüllung</div><h1>Das Vermächtnis der letzten Ritter</h1><div class="line"></div><div class="story reveal"><h2>⚔ BATTLE AREA ⚔</h2><p><strong>Dame Maribolda von Schapenstein,</strong></p><p>Ihr habt jeden Stein umgedreht, die eiserne Reise überstanden, eine Kuh besänftigt und den vergessenen Orden gefunden.</p><p>Nun offenbart der Sternenhimmel den Ort Eurer nächsten großen Prüfung: die <strong>Battle Area in Kirchhain</strong>.</p><p>Der Hohe Rat lädt Euch zu einem gemeinsamen Abenteuer mit Euren beiden treuen Gefährtinnen ein – <strong>an einem anderen Tag, den Ihr gemeinsam festlegen werdet.</strong></p><p>Hiermit überreichen wir Euch feierlich <strong>Euren Gutschein für die Battle Area!</strong></p><p><em>Möge Eure Tapferkeit größer sein als die Pünktlichkeit des königlichen Eisenrosses.</em></p><div style="font-size:45px;margin-top:20px">⚔️ 🛡️ ⚜️</div></div><div class="cta-row"><button class="cta secondary" onclick="nav(9)">Zur letzten Prüfung zurück</button></div>`;state.answers.finished=true;state.unlocked=10;save();$('counter').textContent='10 / 10';$('bar').style.width='100%'}
function render(){const n=state.level;$('main').innerHTML=story();$('counter').textContent=`${Math.min(state.unlocked,10)} / 10`;$('bar').style.width=`${Math.min(state.unlocked,10)*10}%`;$('chapters').innerHTML=TITLES.map((t,i)=>`<button class="chapter ${i===n?'active':''}" ${i>state.unlocked?'disabled':''} onclick="nav(${i})"><span class="number">${i<state.unlocked?'✓':i+1}</span><span>${esc(t)}</span></button>`).join('');if(state.answers.finished&&n===9){state.answers.finished=false;save()}}
// Event delegation keeps text entry independent of chapter rendering.
// A user can type freely without rebuilding the input or losing focus.
$('main').addEventListener('input',event=>{
  const input=event.target.closest('input[data-answer]');
  if(!input)return;
  setGameAnswer(input.dataset.answer,input.value);
});
$('main').addEventListener('keydown',event=>{
  if(event.key==='Enter' && event.target.matches('input[data-answer]')){
    event.preventDefault();
    event.target.blur();
  }
});
$('reset').addEventListener('click',()=>{if(confirm('Möchtet Ihr den gesamten Spielstand wirklich löschen und von vorn beginnen?')){localStorage.removeItem(KEY);location.reload()}});
render();
</script>
</body></html>
